services:
  redis:
    image: redis:7.4-alpine
    container_name: AuthForge-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--save", "60", "1", "--loglevel", "warning" ]
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  redis_data:
