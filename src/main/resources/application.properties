spring.application.name=AuthForge
server.port=8082

spring.datasource.url=${AUTHFORGE_DATABASE_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${AUTHFORGE_DATABASE_USERNAME:authuser}
spring.datasource.password=${AUTHFORGE_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP settings
spring.datasource.hikari.pool-name=AuthForgeHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Hibernate / JPA settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${AUTHFORGE_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.data.redis.host=${AUTHFORGE_REDIS_HOST:localhost}
spring.data.redis.port=${AUTHFORGE_REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

authforge.jwt.secret=${AUTHFORGE_JWT_SECRET}
authforge.jwt.issuer=${AUTHFORGE_JWT_ISSUER:http://localhost:8082}
authforge.jwt.access-token-ttl=${AUTHFORGE_ACCESS_TOKEN_TTL:PT1H}
authforge.refresh-token-ttl=${AUTHFORGE_REFRESH_TOKEN_TTL:P7D}
authforge.bootstrap-token=${AUTHFORGE_BOOTSTRAP_TOKEN}
authforge.oauth2.success-redirect=${AUTHFORGE_OAUTH2_SUCCESS_REDIRECT:http://localhost:8082/auth/oauth2/callback}
authforge.oauth2.exchange-code-ttl=${AUTHFORGE_OAUTH2_EXCHANGE_CODE_TTL:PT1M}
authforge.login.max-failures=${AUTHFORGE_LOGIN_MAX_FAILURES:5}
authforge.login.failure-window=${AUTHFORGE_LOGIN_FAILURE_WINDOW:PT15M}
authforge.login.lock-duration=${AUTHFORGE_LOGIN_LOCK_DURATION:PT15M}
authforge.rate-limit.max-requests=${AUTHFORGE_RATE_LIMIT_MAX_REQUESTS:30}
authforge.rate-limit.window=${AUTHFORGE_RATE_LIMIT_WINDOW:PT1M}

# Social OAuth2 providers. Set real values to enable provider login.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled-google-client}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled-google-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:disabled-github-client}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:disabled-github-secret}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
