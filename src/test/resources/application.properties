spring.datasource.url=jdbc:h2:mem:authforge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.docker.compose.enabled=false
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=false

authforge.jwt.secret=test-only-secret-with-at-least-thirty-two-bytes
authforge.jwt.issuer=http://localhost:8082
authforge.jwt.access-token-ttl=PT1H
authforge.refresh-token-ttl=P7D
authforge.bootstrap-token=test-bootstrap-token
authforge.oauth2.success-redirect=http://localhost:8082/auth/oauth2/callback
authforge.oauth2.exchange-code-ttl=PT1M
authforge.login.max-failures=5
authforge.login.failure-window=PT15M
authforge.login.lock-duration=PT15M
authforge.rate-limit.max-requests=30
authforge.rate-limit.window=PT1M

spring.security.oauth2.client.registration.google.client-id=test-google-client
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.github.client-id=test-github-client
spring.security.oauth2.client.registration.github.client-secret=test-github-secret
spring.security.oauth2.client.registration.github.scope=user:email,read:user
